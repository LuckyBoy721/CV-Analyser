name: Daily Job Scraper (7 AM WIB)

on:
  schedule:
    # 00:00 UTC sama dengan 07:00 WIB (UTC+7)
    - cron: '0 0 * * *'
  workflow_dispatch: # Mengizinkan pemicu manual lewat tombol di GitHub Actions

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar bot bisa melakukan commit & push kembali ke repo

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Hanya install modul yang dibutuhkan untuk scraper
          pip install pandas requests beautifulsoup4

      - name: 🚀 Run Job Scraper (Backend Service)
        run: |
          # Anda bisa mengubah argumen --start dan --end sesuai kebutuhan
          python edo/job_scraper.py --start 1 --end 3

      - name: 💾 Commit and Push Database Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Menambahkan folder tempat Layer 1, 2 (data/) dan Layer 3 (radifan/) disimpan
          git add data/ radifan/
          
          # Commit jika ada data baru, dan gunakan [skip ci] agar tidak memicu action lain secara rekursif
          git commit -m "🤖 auto-update: pembaruan database loker (7 AM WIB) [skip ci]" || echo "Tidak ada data baru untuk di-commit"
          
          git push
